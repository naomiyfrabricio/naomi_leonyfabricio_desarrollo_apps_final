<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards · Cálculo y Lógica</title>
  <style>
    :root {
      --azul: #2f5aa8;
      --azul-oscuro: #1f3d75;
      --azul-claro: #eaf0fb;
      --borde: #d7dee8;
      --texto: #1f2933;
      --texto-suave: #5b6b7c;
      --rojo: #b42318;
      --rojo-claro: #fbe7e5;
      --verde: #1e7a3c;
      --fondo: #f4f6fb;
      --superficie: #ffffff;
      --radio: 12px;
      --sombra: 0 1px 3px rgba(31, 41, 51, .08), 0 1px 2px rgba(31, 41, 51, .06);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --azul: #5b8de0;
        --azul-oscuro: #cfe0fa;
        --azul-claro: #1e2a3f;
        --borde: #33404f;
        --texto: #e6eaf0;
        --texto-suave: #9aa7b8;
        --rojo: #ff8a80;
        --rojo-claro: #3a2222;
        --verde: #5fe0a0;
        --fondo: #121722;
        --superficie: #1a212e;
        --sombra: 0 1px 3px rgba(0, 0, 0, .4), 0 1px 2px rgba(0, 0, 0, .3);
      }
    }
    :root[data-theme="dark"] {
      --azul: #5b8de0;
      --azul-oscuro: #cfe0fa;
      --azul-claro: #1e2a3f;
      --borde: #33404f;
      --texto: #e6eaf0;
      --texto-suave: #9aa7b8;
      --rojo: #ff8a80;
      --rojo-claro: #3a2222;
      --verde: #5fe0a0;
      --fondo: #121722;
      --superficie: #1a212e;
      --sombra: 0 1px 3px rgba(0, 0, 0, .4), 0 1px 2px rgba(0, 0, 0, .3);
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px 16px 48px;
      max-width: 640px;
      margin-inline: auto;
      color: var(--texto);
      background: var(--fondo);
      line-height: 1.4;
      transition: background .15s, color .15s;
    }

    .app-header { position: relative; text-align: center; margin-bottom: 20px; }
    .app-header h1 { font-size: 1.4rem; margin: 0 0 4px; padding-inline: 68px; }
    @media (max-width: 420px) {
      .app-header h1 { font-size: 1.15rem; padding-inline: 56px; }
    }
    .app-header h1 .emoji-titulo { display: inline-block; animation: balanceo 2.4s ease-in-out infinite; }
    .app-header p { margin: 0; color: var(--texto-suave); font-size: .9rem; }
    @keyframes balanceo {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-header h1 .emoji-titulo { animation: none; }
    }
    .botones-header { position: absolute; top: 0; right: 0; display: flex; gap: 6px; }
    .botones-header button {
      width: auto;
      background: var(--superficie); color: var(--texto); border-color: var(--borde);
      padding: 8px 10px; font-size: 1rem; line-height: 1;
    }
    #racha-estudio { margin-top: 4px; font-size: .85rem; color: var(--texto-suave); }

    .panel {
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 {
      font-size: 1rem;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel h3 {
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--texto-suave);
      margin: 18px 0 8px;
    }
    .panel h3:first-of-type { margin-top: 0; }

    form { display: flex; flex-direction: column; gap: 8px; }
    input, button {
      font-size: 1rem;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--borde);
      font-family: inherit;
    }
    input { background: var(--fondo); }
    input:focus { outline: 2px solid var(--azul); outline-offset: 1px; }

    button {
      background: var(--azul); color: #fff; border: 1px solid var(--azul); cursor: pointer; font-weight: 600;
      border-radius: 999px; transition: filter .15s, transform .12s;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(0) scale(.97); }
    button:disabled { background: #c3cbd6; border-color: #c3cbd6; cursor: default; filter: none; transform: none; }
    button.secundario { background: var(--azul-claro); color: var(--azul-oscuro); border-color: var(--azul-claro); }
    button.peligro { background: var(--rojo-claro); color: var(--rojo); border-color: var(--rojo-claro); }
    input, select { border-radius: 10px; }

    .mensaje { min-height: 1.1em; margin: 2px 0 0; font-size: .9rem; }
    .mensaje.error { color: var(--rojo); } .mensaje.ok { color: var(--verde); }

    /* Lista de mazos */
    .toolbar-mazos { display: flex; gap: 8px; margin-bottom: 10px; }
    .toolbar-mazos input { flex: 1 1 auto; min-width: 0; }
    .toolbar-mazos select { flex: 0 0 auto; background: var(--fondo); max-width: 44%; }
    #lista-mazos { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    #lista-mazos li { display: block; }
    #lista-mazos button {
      width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--azul-claro); color: var(--texto); border-color: var(--azul-claro);
      padding: 12px 14px 12px 12px; border-left: 5px solid var(--acento, var(--azul));
      border-radius: 14px;
    }
    #lista-mazos button:hover { transform: translateY(-2px) translateX(0); }
    #lista-mazos .mazo-nombre { font-weight: 600; overflow-wrap: anywhere; }
    #lista-mazos .mazo-meta { font-size: .8rem; color: var(--texto-suave); font-weight: 400; }
    #lista-mazos .mazo-badge {
      flex: none; font-size: .8rem; font-weight: 700; color: var(--acento, var(--azul-oscuro));
      background: color-mix(in srgb, var(--acento, var(--azul)) 20%, var(--superficie));
      border-radius: 999px; padding: 2px 10px;
    }
    #lista-mazos .lista-vacia-aviso { color: var(--texto-suave); font-size: .9rem; padding: 4px 0; }

    /* Detalle de mazo */
    #titulo-mazo { font-size: 1.15rem; margin: 0; }
    #estadisticas { color: var(--texto-suave); font-size: .9rem; margin: 2px 0 0; }
    .fila { display: flex; gap: 8px; }
    .fila button { flex: 1; }

    #lista-tarjetas { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .tarjeta-fila {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px;
    }
    .tarjeta-fila span { flex: 1 1 100%; overflow-wrap: anywhere; font-size: .95rem; }
    .tarjeta-fila button { padding: 6px 12px; font-size: .85rem; width: auto; flex: none; }

    /* Opciones de estudio */
    .opcion-estudio { display: flex; align-items: center; gap: 6px; font-size: .9rem; margin-bottom: 8px; cursor: pointer; }
    .opcion-estudio input[type="checkbox"] { width: auto; flex: none; }
    .opcion-estudio input[type="number"] { padding: 4px 6px; }

    /* Presentación / explicación del tema (extra, ver docs/plan_incrementos.md §1) */
    .panel-presentacion { background: linear-gradient(180deg, var(--superficie), var(--azul-claro) 180%); }
    #posicion-presentacion { text-align: center; color: var(--texto-suave); font-weight: 600; margin: 0 0 8px; }
    #barra-progreso-presentacion { height: 100%; width: 0%; background: var(--azul); border-radius: 999px; transition: width .25s ease; }
    .tarjeta-presentacion {
      border: 2px solid var(--azul); border-radius: var(--radio); background: var(--superficie);
      padding: 28px 24px; min-height: 220px; overflow-wrap: anywhere;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px;
      box-shadow: var(--sombra);
    }
    .pregunta-presentacion { font-size: 1.25rem; font-weight: 700; }
    .respuesta-presentacion { color: var(--azul-oscuro); font-weight: 700; font-size: 1.05rem; }
    .explicacion-presentacion { color: var(--texto-suave); font-size: .95rem; line-height: 1.5; max-width: 46ch; }

    /* Estudio */
    #posicion { text-align: center; color: var(--texto-suave); font-weight: 600; margin: 0 0 8px; }
    .barra-progreso { height: 8px; border-radius: 999px; background: var(--borde); overflow: hidden; margin-bottom: 8px; }
    .barra-progreso > div { height: 100%; width: 0%; background: var(--azul); border-radius: 999px; transition: width .25s ease; }
    #temporizador-estudio { text-align: center; font-weight: 700; color: var(--rojo); min-height: 1.2em; margin: 0 0 8px; }
    #tarjeta {
      border: 2px solid var(--azul); border-radius: var(--radio); background: var(--azul-claro);
      padding: 28px 20px; min-height: 140px; cursor: pointer; overflow-wrap: anywhere;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px;
      transition: border-color .2s, box-shadow .2s;
    }
    #tarjeta:hover { box-shadow: 0 4px 14px rgba(47, 90, 168, .18); }
    #pregunta { font-size: 1.1rem; font-weight: 600; }
    #respuesta { color: var(--azul-oscuro); font-weight: 600; min-height: 1.3em; }
    #respuesta:not(:empty) { animation: aparecer .25s ease-out; }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(6px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    #tarjeta.resultado-acierto { border-color: var(--verde); animation: destello-ok .5s ease; }
    #tarjeta.resultado-fallo { animation: sacudida .4s ease; }
    @keyframes destello-ok {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--verde) 45%, transparent); }
      100% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--verde) 0%, transparent); }
    }
    @keyframes sacudida {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    #msg-estudio { text-align: center; margin-top: 10px; }
    @media (prefers-reduced-motion: reduce) {
      #respuesta:not(:empty), #tarjeta.resultado-acierto, #tarjeta.resultado-fallo { animation: none; }
    }

    @media (max-width: 420px) {
      body { padding: 14px 10px 36px; }
      .panel { padding: 12px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="botones-header">
      <button type="button" id="btn-sonido" aria-label="Activar o silenciar sonidos">🔊</button>
      <button type="button" id="btn-tema" aria-label="Cambiar tema claro/oscuro">🌙</button>
    </div>
    <h1><span class="emoji-titulo">📚</span> Flashcards · Cálculo y Lógica</h1>
    <p>Crea mazos, repasa y lleva el control de tu avance.</p>
    <p id="racha-estudio"></p>
  </header>

  <section class="panel">
    <h2>➕ Crear un mazo</h2>
    <form id="form-mazo">
      <input id="nombre-mazo" placeholder="Nombre del nuevo mazo" aria-label="Nombre del mazo">
      <button type="submit">Crear mazo</button>
    </form>
    <p id="msg-mazo" class="mensaje"></p>

    <h3>Importar desde archivo</h3>
    <form id="form-importar">
      <input id="archivo-importar" type="file" accept="application/json,.json" aria-label="Archivo de mazo a importar">
      <button type="submit" class="secundario">Importar mazo(s) desde archivo</button>
    </form>
    <p id="msg-importar" class="mensaje"></p>
    <button type="button" id="btn-exportar-todos" class="secundario">⇩ Exportar todos mis mazos</button>
  </section>

  <section class="panel">
    <h2>🗂️ Tus mazos</h2>
    <div class="toolbar-mazos">
      <input id="buscar-mazo" type="search" placeholder="Buscar mazo por nombre..." aria-label="Buscar mazo">
      <select id="ordenar-mazos" aria-label="Ordenar mazos">
        <option value="nombre">Nombre (A-Z)</option>
        <option value="porcentaje-desc">Avance (mayor a menor)</option>
        <option value="porcentaje-asc">Avance (menor a mayor)</option>
        <option value="tarjetas-desc">Tarjetas (más a menos)</option>
      </select>
    </div>
    <ul id="lista-mazos"></ul>
    <p id="msg-buscar-mazo" class="mensaje"></p>
  </section>

  <section id="seccion-mazo" class="panel" hidden>
    <h2 id="titulo-mazo"></h2>
    <p id="estadisticas"></p>

    <button id="btn-ver-explicacion" type="button" class="secundario" style="margin-bottom: 4px;">📖 Ver explicación del tema</button>

    <h3>Datos del mazo</h3>
    <form id="form-renombrar">
      <input id="nuevo-nombre" aria-label="Nuevo nombre del mazo">
      <div class="fila">
        <button type="submit" class="secundario">Renombrar</button>
        <button type="button" id="btn-eliminar-mazo" class="peligro">Eliminar mazo</button>
      </div>
    </form>
    <div class="fila" style="margin-top: 8px;">
      <button type="button" id="btn-exportar-mazo" class="secundario">⇩ Exportar este mazo</button>
      <button type="button" id="btn-duplicar-mazo" class="secundario">📄 Duplicar mazo</button>
    </div>

    <h3>Tarjetas</h3>
    <ul id="lista-tarjetas"></ul>
    <form id="form-tarjeta" style="margin-top: 10px;">
      <input id="pregunta-in" placeholder="Pregunta" aria-label="Pregunta">
      <input id="respuesta-in" placeholder="Respuesta" aria-label="Respuesta">
      <button type="submit" id="btn-tarjeta">Añadir tarjeta</button>
    </form>
    <p id="msg-tarjeta" class="mensaje"></p>

    <h3>Opciones de estudio</h3>
    <label class="opcion-estudio"><input type="checkbox" id="chk-aleatorio"> 🔀 Orden aleatorio</label>
    <label class="opcion-estudio">
      <input type="checkbox" id="chk-examen"> ⏱ Modo examen, con
      <input type="number" id="examen-segundos" value="20" min="5" max="300" style="width: 70px; display: inline-block;"> segundos por tarjeta
    </label>
    <label class="opcion-estudio"><input type="checkbox" id="chk-explicacion-previa" checked> 📖 Ver la explicación antes de empezar</label>
    <button id="btn-estudiar" type="button" style="margin-top: 10px;">▶ Estudiar este mazo</button>
  </section>

  <section id="seccion-estudio" class="panel" hidden>
    <h2>🧠 Modo estudio</h2>
    <p id="posicion"></p>
    <div class="barra-progreso"><div id="barra-progreso-relleno"></div></div>
    <p id="temporizador-estudio"></p>
    <div id="tarjeta"><div id="pregunta"></div><div id="respuesta"></div></div>

    <form id="form-comprobar" style="margin-top: 12px;">
      <input id="respuesta-usuario" placeholder="Escribe tu respuesta..." aria-label="Tu respuesta" autocomplete="off">
      <button type="submit" id="btn-comprobar">Comprobar respuesta</button>
    </form>
    <p id="msg-comprobar" class="mensaje"></p>

    <div class="fila" style="margin-top: 8px;">
      <button id="btn-revelar" type="button" class="secundario">No lo sé, mostrar respuesta</button>
      <button id="btn-siguiente" type="button" class="secundario">Siguiente</button>
    </div>
    <div class="fila" style="margin-top: 8px;">
      <button id="btn-acierto" type="button">✓ Acerté</button>
      <button id="btn-fallo" type="button" class="peligro">✗ Fallé</button>
    </div>
    <p id="msg-estudio" class="mensaje ok"></p>
    <button id="btn-repasar-errores" type="button" class="peligro" style="margin-top: 8px;" hidden>🔁 Repasar mis errores</button>
  </section>

  <section id="seccion-presentacion" class="panel panel-presentacion" hidden>
    <h2>📖 Explicación del tema</h2>
    <p id="posicion-presentacion"></p>
    <div class="barra-progreso"><div id="barra-progreso-presentacion"></div></div>
    <div class="tarjeta-presentacion">
      <div id="pregunta-presentacion" class="pregunta-presentacion"></div>
      <div id="respuesta-presentacion" class="respuesta-presentacion"></div>
      <div id="explicacion-presentacion" class="explicacion-presentacion"></div>
    </div>
    <div class="fila" style="margin-top: 10px;">
      <button id="btn-anterior-presentacion" type="button" class="secundario">◀ Anterior</button>
      <button id="btn-siguiente-presentacion" type="button" class="secundario">Siguiente ▶</button>
    </div>
    <button id="btn-empezar-preguntas" type="button" style="margin-top: 8px;" hidden>▶ Empezar preguntas</button>
    <button id="btn-cerrar-presentacion" type="button" class="peligro" style="margin-top: 8px;">Cerrar</button>
  </section>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
