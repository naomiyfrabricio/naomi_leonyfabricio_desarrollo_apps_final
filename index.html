<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards · Cálculo y Lógica</title>
  <style>
    :root {
      --azul: #2f5aa8;
      --azul-oscuro: #1f3d75;
      --azul-claro: #eaf0fb;
      --borde: #d7dee8;
      --texto: #1f2933;
      --texto-suave: #5b6b7c;
      --rojo: #b42318;
      --rojo-claro: #fbe7e5;
      --verde: #1e7a3c;
      --fondo: #f4f6fb;
      --superficie: #ffffff;
      --radio: 12px;
      --sombra: 0 1px 3px rgba(31, 41, 51, .08), 0 1px 2px rgba(31, 41, 51, .06);
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px 16px 48px;
      max-width: 640px;
      margin-inline: auto;
      color: var(--texto);
      background: var(--fondo);
      line-height: 1.4;
    }

    .app-header { text-align: center; margin-bottom: 20px; }
    .app-header h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .app-header p { margin: 0; color: var(--texto-suave); font-size: .9rem; }

    .panel {
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 {
      font-size: 1rem;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel h3 {
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--texto-suave);
      margin: 18px 0 8px;
    }
    .panel h3:first-of-type { margin-top: 0; }

    form { display: flex; flex-direction: column; gap: 8px; }
    input, button {
      font-size: 1rem;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--borde);
      font-family: inherit;
    }
    input { background: var(--fondo); }
    input:focus { outline: 2px solid var(--azul); outline-offset: 1px; }

    button { background: var(--azul); color: #fff; border: 1px solid var(--azul); cursor: pointer; font-weight: 600; transition: filter .15s; }
    button:hover { filter: brightness(1.08); }
    button:disabled { background: #c3cbd6; border-color: #c3cbd6; cursor: default; filter: none; }
    button.secundario { background: var(--azul-claro); color: var(--azul-oscuro); border-color: var(--azul-claro); }
    button.peligro { background: var(--rojo-claro); color: var(--rojo); border-color: var(--rojo-claro); }

    .mensaje { min-height: 1.1em; margin: 2px 0 0; font-size: .9rem; }
    .mensaje.error { color: var(--rojo); } .mensaje.ok { color: var(--verde); }

    /* Lista de mazos */
    .toolbar-mazos { display: flex; gap: 8px; margin-bottom: 10px; }
    .toolbar-mazos input { flex: 1 1 auto; min-width: 0; }
    .toolbar-mazos select { flex: 0 0 auto; background: var(--fondo); max-width: 44%; }
    #lista-mazos { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    #lista-mazos li { display: block; }
    #lista-mazos button {
      width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--azul-claro); color: var(--texto); border-color: var(--azul-claro);
      padding: 12px 14px;
    }
    #lista-mazos .mazo-nombre { font-weight: 600; overflow-wrap: anywhere; }
    #lista-mazos .mazo-meta { font-size: .8rem; color: var(--texto-suave); font-weight: 400; }
    #lista-mazos .mazo-badge {
      flex: none; font-size: .8rem; font-weight: 700; color: var(--azul-oscuro);
      background: #fff; border-radius: 999px; padding: 2px 10px;
    }
    #lista-mazos .lista-vacia-aviso { color: var(--texto-suave); font-size: .9rem; padding: 4px 0; }

    /* Detalle de mazo */
    #titulo-mazo { font-size: 1.15rem; margin: 0; }
    #estadisticas { color: var(--texto-suave); font-size: .9rem; margin: 2px 0 0; }
    .fila { display: flex; gap: 8px; }
    .fila button { flex: 1; }

    #lista-tarjetas { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .tarjeta-fila {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; padding: 10px 12px;
    }
    .tarjeta-fila span { flex: 1 1 100%; overflow-wrap: anywhere; font-size: .95rem; }
    .tarjeta-fila button { padding: 6px 12px; font-size: .85rem; width: auto; flex: none; }

    /* Estudio */
    #posicion { text-align: center; color: var(--texto-suave); font-weight: 600; margin: 0 0 10px; }
    #tarjeta {
      border: 2px solid var(--azul); border-radius: var(--radio); background: var(--azul-claro);
      padding: 28px 20px; min-height: 140px; cursor: pointer; overflow-wrap: anywhere;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px;
    }
    #pregunta { font-size: 1.1rem; font-weight: 600; }
    #respuesta { color: var(--azul-oscuro); font-weight: 600; min-height: 1.3em; }
    #msg-estudio { text-align: center; margin-top: 10px; }

    @media (max-width: 420px) {
      body { padding: 14px 10px 36px; }
      .panel { padding: 12px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>📚 Flashcards · Cálculo y Lógica</h1>
    <p>Crea mazos, repasa y lleva el control de tu avance.</p>
  </header>

  <section class="panel">
    <h2>➕ Crear un mazo</h2>
    <form id="form-mazo">
      <input id="nombre-mazo" placeholder="Nombre del nuevo mazo" aria-label="Nombre del mazo">
      <button type="submit">Crear mazo</button>
    </form>
    <p id="msg-mazo" class="mensaje"></p>

    <h3>Importar desde archivo</h3>
    <form id="form-importar">
      <input id="archivo-importar" type="file" accept="application/json,.json" aria-label="Archivo de mazo a importar">
      <button type="submit" class="secundario">Importar mazo desde archivo</button>
    </form>
    <p id="msg-importar" class="mensaje"></p>
  </section>

  <section class="panel">
    <h2>🗂️ Tus mazos</h2>
    <div class="toolbar-mazos">
      <input id="buscar-mazo" type="search" placeholder="Buscar mazo por nombre..." aria-label="Buscar mazo">
      <select id="ordenar-mazos" aria-label="Ordenar mazos">
        <option value="nombre">Nombre (A-Z)</option>
        <option value="porcentaje-desc">Avance (mayor a menor)</option>
        <option value="porcentaje-asc">Avance (menor a mayor)</option>
        <option value="tarjetas-desc">Tarjetas (más a menos)</option>
      </select>
    </div>
    <ul id="lista-mazos"></ul>
    <p id="msg-buscar-mazo" class="mensaje"></p>
  </section>

  <section id="seccion-mazo" class="panel" hidden>
    <h2 id="titulo-mazo"></h2>
    <p id="estadisticas"></p>

    <h3>Datos del mazo</h3>
    <form id="form-renombrar">
      <input id="nuevo-nombre" aria-label="Nuevo nombre del mazo">
      <div class="fila">
        <button type="submit" class="secundario">Renombrar</button>
        <button type="button" id="btn-eliminar-mazo" class="peligro">Eliminar mazo</button>
      </div>
    </form>
    <div class="fila" style="margin-top: 8px;">
      <button type="button" id="btn-exportar-mazo" class="secundario">⇩ Exportar este mazo</button>
    </div>

    <h3>Tarjetas</h3>
    <ul id="lista-tarjetas"></ul>
    <form id="form-tarjeta" style="margin-top: 10px;">
      <input id="pregunta-in" placeholder="Pregunta" aria-label="Pregunta">
      <input id="respuesta-in" placeholder="Respuesta" aria-label="Respuesta">
      <button type="submit" id="btn-tarjeta">Añadir tarjeta</button>
    </form>
    <p id="msg-tarjeta" class="mensaje"></p>

    <button id="btn-estudiar" type="button" style="margin-top: 14px;">▶ Estudiar este mazo</button>
  </section>

  <section id="seccion-estudio" class="panel" hidden>
    <h2>🧠 Modo estudio</h2>
    <p id="posicion"></p>
    <div id="tarjeta"><div id="pregunta"></div><div id="respuesta"></div></div>
    <div class="fila" style="margin-top: 10px;">
      <button id="btn-revelar" type="button">Revelar respuesta</button>
      <button id="btn-siguiente" type="button" class="secundario">Siguiente</button>
    </div>
    <div class="fila" style="margin-top: 8px;">
      <button id="btn-acierto" type="button">✓ Acerté</button>
      <button id="btn-fallo" type="button" class="peligro">✗ Fallé</button>
    </div>
    <p id="msg-estudio" class="mensaje ok"></p>
  </section>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
